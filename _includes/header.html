<header class="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav">
      <a class="page-link{% if page.url == '/' or page.layout == 'post' %} is-active{% endif %}" href="{{ '/' | relative_url }}">Blog</a>
      {%- for p in site.pages %}
        {%- if p.title and p.isnav %}
      <a class="page-link{% if page.url == p.url %} is-active{% endif %}" href="{{ p.url | relative_url }}">{{ p.title }}</a>
        {%- endif %}
      {%- endfor %}
    </nav>
  </div>
</header>
